<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>韓文學習｜從零到 TOPIK 2 級前</title>
<style>
:root{--bg:#eef4f1;--sf:#fff;--tx:#1c2b3a;--mu:#5f7080;--ac:#2f7f72;--ac2:#d9ece7;--gold:#f2b84b;--bd:#cfdcd7;--ok:#238a5b;--no:#c7402f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121b24;--sf:#1b2733;--tx:#eaf1f4;--mu:#93a6b3;--ac:#5fc4b2;--ac2:#1f3a3a;--bd:#2c3b49;--ok:#4cc790;--no:#ff8070;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121b24;--sf:#1b2733;--tx:#eaf1f4;--mu:#93a6b3;--ac:#5fc4b2;--ac2:#1f3a3a;--bd:#2c3b49;--ok:#4cc790;--no:#ff8070;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:18px 16px}
h1{font-size:26px;line-height:1.3;margin:6px 0 6px}h2{font-size:19px;margin:20px 0 8px}
p{margin:6px 0}.mu{color:var(--mu);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.start{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--sf);border:1.5px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.start:active{border-color:var(--ac)}
.start b{display:block;font-size:17px}.start span.i{font-size:28px;flex:none}
.bar{height:8px;background:var(--ac2);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.chip{flex:none;border:1.5px solid var(--bd);background:var(--sf);border-radius:20px;padding:6px 14px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.note{background:var(--ac2);border-radius:10px;padding:10px 12px;font-size:14.5px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tile{aspect-ratio:1;font-size:26px;background:var(--sf);border:1.5px solid var(--bd);border-radius:10px}
.tile.done{border-color:var(--ac);background:var(--ac2)}.tile.sel{outline:3px solid var(--gold)}
.card{margin:14px 0;background:var(--sf);border:1.5px solid var(--bd);border-radius:16px;padding:14px;text-align:center}
.big{font-size:96px;line-height:1.2;width:180px;height:180px;margin:0 auto;display:flex;align-items:center;justify-content:center;border:1.5px dashed var(--bd);border-radius:6px;background:
linear-gradient(var(--bd),var(--bd)) center/1px 100% no-repeat,linear-gradient(var(--bd),var(--bd)) center/100% 1px no-repeat}
.rom{min-height:34px;font-size:19px;margin:10px 0;font-weight:600}
.row{display:flex;gap:8px;margin:8px 0}.row>*{flex:1}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:11px 14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--tx);border:1.5px solid var(--bd)}
.btn.wide{width:100%;margin-top:12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.opt{background:var(--sf);border:1.5px solid var(--bd);border-radius:12px;padding:14px 8px;font-size:22px}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.no{background:var(--no);color:#fff;border-color:var(--no)}
.w{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--sf);border:1.5px solid var(--bd);border-radius:12px;padding:10px 14px;margin:6px 0;text-align:left}
.w b{font-size:20px}
details{background:var(--sf);border:1.5px solid var(--bd);border-radius:12px;padding:10px 14px;margin:8px 0}
summary{font-weight:700;cursor:pointer}
.ex{display:block;width:100%;text-align:left;background:var(--ac2);border:0;border-radius:8px;padding:8px 10px;margin:6px 0}
.bad{color:var(--no)}.good{color:var(--ok)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1.5px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;font-size:12px;padding:4px 0;color:var(--mu)}
nav button.on{color:var(--ac);font-weight:700}nav span{display:block;font-size:20px}
</style></head><body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const G=[
{n:'基本母音',tip:'韓文母音像「積木」：ㅏㅓ 是橫向的音，ㅗㅜ 是縱向的音。ㅓ（eo）嘴巴張大像「喔」，ㅗ（o）嘴巴要圓。',d:[['ㅏ','a','像「阿」','아'],['ㅑ','ya','像「呀」','야'],['ㅓ','eo','嘴大的「喔」','어'],['ㅕ','yeo','像「有喔」','여'],['ㅗ','o','圓唇「歐」','오'],['ㅛ','yo','像「優」','요'],['ㅜ','u','圓唇「烏」','우'],['ㅠ','yu','像「油」','유'],['ㅡ','eu','嘴扁的「ㄜ」','으'],['ㅣ','i','像「衣」','이']]},
{n:'基本子音',tip:'子音要搭配母音才唸得出來，這裡都以「子音＋ㅏ」發音。ㅇ 在字首不發音，只是佔位。',d:[['ㄱ','g / k','像「ㄍ」','가'],['ㄴ','n','像「ㄋ」','나'],['ㄷ','d / t','像「ㄉ」','다'],['ㄹ','r / l','介於 ㄌ 與 ㄖ','라'],['ㅁ','m','像「ㄇ」','마'],['ㅂ','b / p','像「ㄅ」','바'],['ㅅ','s','像「ㄙ」','사'],['ㅇ','無聲 / ng','字首不發音','아'],['ㅈ','j','像「ㄐ」','자'],['ㅎ','h','像「ㄏ」','하']]},
{n:'激音',tip:'激音要「送氣」：把手掌放在嘴前，唸的時候應該感覺到明顯的氣流，比基本子音強很多。',d:[['ㅊ','ch','送氣的「ㄑ」','차'],['ㅋ','k','送氣的「ㄎ」','카'],['ㅌ','t','送氣的「ㄊ」','타'],['ㅍ','p','送氣的「ㄆ」','파']]},
{n:'緊音',tip:'緊音要「喉嚨用力、不送氣」，像突然收緊再放開。對照：가（輕）、카（送氣）、까（緊）。',d:[['ㄲ','kk','緊的「ㄍ」','까'],['ㄸ','tt','緊的「ㄉ」','따'],['ㅃ','pp','緊的「ㄅ」','빠'],['ㅆ','ss','緊的「ㄙ」','싸'],['ㅉ','jj','緊的「ㄐ」','짜']]},
{n:'複合母音',tip:'複合母音是兩個母音接起來唸。現代韓語中 ㅐ 和 ㅔ 的發音幾乎一樣，聽力上不用太糾結。',d:[['ㅐ','ae','像「ㄟ」','애'],['ㅒ','yae','像「也ㄟ」','얘'],['ㅔ','e','像「ㄟ」','에'],['ㅖ','ye','像「也」','예'],['ㅘ','wa','像「哇」','와'],['ㅙ','wae','像「ㄨㄟ」','왜'],['ㅚ','oe','像「ㄨㄟ」','외'],['ㅝ','wo','像「窩」','워'],['ㅞ','we','像「ㄨㄟ」','웨'],['ㅟ','wi','像「威」','위'],['ㅢ','ui','像「ㄜ衣」','의']]}];
const V=[['안녕하세요','你好','annyeonghaseyo'],['감사합니다','謝謝','gamsahamnida'],['네','是','ne'],['아니요','不是','aniyo'],['물','水','mul'],['밥','飯','bap'],['학교','學校','hakgyo'],['친구','朋友','chingu'],['사람','人','saram'],['한국','韓國','hanguk'],['대만','台灣','daeman'],['커피','咖啡','keopi'],['집','家','jip'],['오늘','今天','oneul'],['맛있어요','好吃','masisseoyo'],['사랑','愛','sarang']];
const VT=[
{n:'問候',d:[...V.slice(0,4),['안녕히 가세요','再見（對離開的人）','annyeonghi gaseyo'],['죄송합니다','對不起','joesonghamnida'],['괜찮아요','沒關係','gwaenchanayo'],['처음 뵙겠습니다','初次見面','cheoeum boepgetseumnida']]},
{n:'數字（固有語）',note:'固有語數字用來數「個、歲、人」等。',d:[['하나','1','hana'],['둘','2','dul'],['셋','3','set'],['넷','4','net'],['다섯','5','daseot'],['여섯','6','yeoseot'],['일곱','7','ilgop'],['여덟','8','yeodeol']]},
{n:'數字（漢字語）',note:'漢字語數字用於日期、金額、電話號碼等。',d:[['일','1','il'],['이','2','i'],['삼','3','sam'],['사','4','sa'],['오','5','o'],['육','6','yuk'],['칠','7','chil'],['팔','8','pal']]},
{n:'飲食',d:[['김치','泡菜','gimchi'],['고기','肉','gogi'],['과일','水果','gwail'],['우유','牛奶','uyu'],['빵','麵包','ppang'],['차','茶','cha'],['물','水','mul'],['밥','飯','bap']]},
{n:'人物',d:[['가족','家人','gajok'],['엄마','媽媽','eomma'],['아빠','爸爸','appa'],['친구','朋友','chingu'],['선생님','老師','seonsaengnim'],['학생','學生','haksaeng'],['사람','人','saram'],['아이','小孩','ai']]},
{n:'地點',d:[['집','家','jip'],['학교','學校','hakgyo'],['회사','公司','hoesa'],['병원','醫院','byeongwon'],['식당','餐廳','sikdang'],['지하철','地鐵','jihacheol'],['공항','機場','gonghang'],['화장실','洗手間','hwajangsil']]},
{n:'時間',d:[['오늘','今天','oneul'],['내일','明天','naeil'],['어제','昨天','eoje'],['지금','現在','jigeum'],['아침','早上','achim'],['저녁','晚上','jeonyeok'],['주말','週末','jumal'],['시간','時間','sigan']]}];
let vt=0,vq=null;
function voc(){
 if(vq)return vquiz();
 const t=VT[vt];
 return `<h1>單字</h1><div class="chips">${VT.map((x,i)=>`<button class="chip ${i==vt?'on':''}" onclick="vt=${i};render()">${x.n}</button>`).join('')}</div>${t.note?`<div class="note">${t.note}</div>`:''}<div class="row"><button class="btn ghost" onclick="hide=!hide;render()">${hide?'顯示中文':'隱藏中文'}</button></div>${t.d.map(w=>`<button class="w" onclick="say('${w[0]}')"><span><b>${w[0]}</b><br><span class="mu">${w[2]}</span></span><span>${hide?'？':w[1]} 🔊</span></button>`).join('')}<button class="btn wide" onclick="startV()">🎯 測驗：${t.n}</button>`}
function startV(){vq={l:sh(VT[vt].d),i:0,s:0,done:false};askV()}
function askV(){const t=VT[vt].d,c=vq.l[vq.i];vq.o=sh([c[1],...sh(t.filter(x=>x[1]!=c[1])).slice(0,3).map(x=>x[1])]);vq.a=null;setTimeout(()=>say(c[0]),200);render()}
function va(k){if(vq.a!==null)return;vq.a=k;if(vq.o[k]==vq.l[vq.i][1])vq.s++;render();setTimeout(()=>{vq.i++;if(vq.i>=vq.l.length){vq.done=true;render()}else askV()},800)}
function vquiz(){
 if(vq.done)return `<h1>測驗完成</h1><div class="card"><div class="big" style="font-size:64px">${vq.s}/${vq.l.length}</div><p>${vq.s==vq.l.length?'全對！換下一個主題吧。':'再看一遍單字卡，會越來越熟。'}</p></div><button class="btn wide" onclick="startV()">再測一次</button><button class="btn wide ghost" onclick="vq=null;render()">回單字卡</button>`;
 const c=vq.l[vq.i];
 return `<h1>單字測驗</h1><p class="mu">第 ${vq.i+1} / ${vq.l.length} 題　${VT[vt].n}</p><div class="card"><div class="big" style="font-size:${c[0].length>4?32:48}px">${c[0]}</div><button class="btn ghost" onclick="say('${c[0]}')">🔊 再聽一次</button></div><p>選出正確的意思：</p><div class="opts">${vq.o.map((o,k)=>`<button class="opt ${vq.a===null?'':(o==c[1]?'ok':(k==vq.a?'no':''))}" style="font-size:17px" onclick="va(${k})">${o}</button>`).join('')}</div>`}
const GR=[
['은 / 는　主題助詞','「關於…來說」。前面字最後有子音用「은」，沒有子音用「는」。',[['저는 학생이에요.','我是學生。'],['책은 재미있어요.','書很有趣。']]],
['이 / 가　主語助詞','標示動作或狀態的主語。有子音用「이」，沒有用「가」。',[['친구가 와요.','朋友來了。'],['물이 있어요.','有水。']]],
['을 / 를　受詞助詞','標示動作的對象。有子音用「을」，沒有用「를」。',[['밥을 먹어요.','我吃飯。'],['커피를 마셔요.','我喝咖啡。']]],
['-아요 / -어요　敬語現在式','動詞去掉「다」，詞幹最後母音是 ㅏ/ㅗ 加「아요」，其他加「어요」，하다 變「해요」。',[['가다 → 가요','去'],['먹다 → 먹어요','吃'],['하다 → 해요','做']]],
['-았어요 / -었어요　過去式','規則和現在式相同：詞幹最後母音是 ㅏ/ㅗ 加「았어요」，其他加「었어요」，하다 變「했어요」。',[['가다 → 갔어요','去了'],['먹다 → 먹었어요','吃了'],['하다 → 했어요','做了']]],
['-고　然後 / 而且','連接兩個動作或狀態，接在詞幹後面。',[['밥을 먹고 커피를 마셔요.','吃完飯後喝咖啡。'],['이 집은 크고 예뻐요.','這間房子又大又漂亮。']]],
['-지만　但是','表示轉折，接在詞幹後面。',[['한국어는 어렵지만 재미있어요.','韓語雖然難，但很有趣。'],['비싸지만 맛있어요.','雖然貴，但很好吃。']]],
['-고 싶어요　想要','詞幹加「고 싶어요」，表示「我想做…」。',[['한국에 가고 싶어요.','我想去韓國。'],['커피를 마시고 싶어요.','我想喝咖啡。']]],
['에 / 에서　地點助詞','「에」表示去的地方或存在的地點；「에서」表示動作發生的地點。',[['학교에 가요.','去學校。'],['집에서 밥을 먹어요.','在家吃飯。']]],
['안　否定','動詞前加「안」，表示「不做…」。',[['안 먹어요.','我不吃。'],['안 가요.','我不去。']]]];
const ER=[
['ㅓ 和 ㅗ 搞混','어머니（媽媽）','오머니','ㅓ 嘴巴張大像「喔」，ㅗ 嘴唇要圓像「歐」。多聽、多對比練習。'],
['은/는 和 이/가 用混','저는 학생이에요.（介紹自己）','저가 학생이에요.','「저」後面通常搭配「는」。은/는 提出主題，이/가 強調主語，初學先記固定搭配。'],
['照字面唸收尾音','합니다 唸作 [함니다]','唸成 [합니다]','收尾音 ㅂ 遇到 ㄴ 會變成 ㅁ。韓文是「照規則唸」，不是照字面唸。'],
['平音、激音、緊音不分','가 / 카 / 까 要分開唸','全部唸成同一個音','三者差在氣流和喉嚨力度，可以用手掌感覺氣流。'],
['受詞助詞接錯','밥을 먹어요.','밥를 먹어요.','밥 以子音（ㅂ）結尾，要用「을」；以母音結尾才用「를」。']];
const PQ=[['「ㅏ」怎麼唸？',['a','eo','o','u'],0],['「감사합니다」是什麼意思？',['謝謝','你好','再見','對不起'],0],['「저는 학생이에요」的「는」是什麼功能？',['主題助詞','受詞助詞','地點助詞','過去式'],0],['「밥__ 먹어요」要填哪個？',['를','을','는','가'],1]];
const $=s=>document.getElementById(s);
let cur='home',gi=0,ci=-1,show=false,q=null,pl=null,hide=false;
let P={};try{P=JSON.parse(localStorage.getItem('kp')||'{}')}catch(e){}
function save(){try{localStorage.setItem('kp',JSON.stringify(P))}catch(e){}}
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function go(t){cur=t;ci=-1;q=null;vq=null;pl=null;render();scrollTo(0,0)}
function home(){
 const n=G.reduce((s,g,i)=>s+g.d.filter((_,j)=>P['l'+i+'_'+j]).length,0);
 return `<h1>韓文學習 🇰🇷</h1><p class="mu">從完全不會，到 TOPIK 2 級前。選一個適合你的起點就能開始。</p>
 <h2>你想從哪裡開始？</h2>
 <button class="start" onclick="go('abc')"><span class="i">🌱</span><div><b>完全零基礎</b><span class="mu">從 40 音和發音開始</span></div></button>
 <button class="start" onclick="go('voc')"><span class="i">🔤</span><div><b>認得字母，想學單字</b><span class="mu">日常常用單字，邊聽邊記</span></div></button>
 <button class="start" onclick="go('gra')"><span class="i">💬</span><div><b>會簡單單字，想學文法</b><span class="mu">助詞、過去式與常用句型</span></div></button>
 <button class="start" onclick="go('err')"><span class="i">🎯</span><div><b>學過一陣子，想修正錯誤</b><span class="mu">初學者最常犯的錯</span></div></button>
 <button class="start" onclick="startP()"><span class="i">🧭</span><div><b>不確定？做 4 題小測驗</b><span class="mu">幫你推薦起點</span></div></button>
 <h2>40 音進度</h2><div class="bar"><i style="width:${n/40*100}%"></i></div><p class="mu">已看過 ${n} / 40 個字母${P.best?'　最佳測驗：'+P.best+' 分':''}</p>`}
function abc(){
 const g=G[gi];
 let h=`<h1>40 音</h1><div class="chips">${G.map((x,i)=>`<button class="chip ${i==gi?'on':''}" onclick="gi=${i};ci=-1;show=false;render()">${x.n}</button>`).join('')}</div><div class="note">${g.tip}</div>
 <div class="grid">${g.d.map((c,i)=>`<button class="tile ${P['l'+gi+'_'+i]?'done':''} ${i==ci?'sel':''}" onclick="pick(${i})">${c[0]}</button>`).join('')}</div>`;
 if(ci>=0){const c=g.d[ci];h+=`<div class="card"><div class="big">${c[0]}</div><div class="rom">${show?c[1]+'　'+c[2]:'先想想怎麼唸，再看答案'}</div>
 <div class="row"><button class="btn" onclick="say('${c[3]}')">🔊 聽發音</button><button class="btn ghost" onclick="show=!show;render()">${show?'隱藏讀音':'顯示讀音'}</button></div>
 <div class="row"><button class="btn ghost" onclick="step(-1)">上一個</button><button class="btn ghost" onclick="step(1)">下一個</button></div></div>`}
 else h+=`<p class="mu" style="margin-top:12px">點任一個字母開始學習。</p>`;
 return h+`<button class="btn wide" onclick="startQ()">🎧 聽音測驗：${g.n}</button>`}
function pick(i){ci=i;show=false;P['l'+gi+'_'+i]=1;save();say(G[gi].d[i][3]);render()}
function step(d){const n=G[gi].d.length;pick((ci+d+n)%n)}
function startQ(){const g=G[gi];q={l:sh(g.d).slice(0,8),i:0,s:0,done:false};ask()}
function ask(){const g=G[gi],c=q.l[q.i];const pool=g.d.length>=4?g.d:G.flatMap(x=>x.d);
 q.o=sh([c,...sh(pool.filter(x=>x[0]!=c[0])).slice(0,3)]);q.a=null;setTimeout(()=>say(c[3]),200);render()}
function ans(k){if(q.a!==null)return;q.a=k;const c=q.l[q.i];if(q.o[k][0]==c[0])q.s++;render();
 setTimeout(()=>{q.i++;if(q.i>=q.l.length){q.done=true;P.best=Math.max(P.best||0,q.s);save();render()}else ask()},800)}
function quiz(){
 if(q.done)return `<h1>測驗完成</h1><div class="card"><div class="big" style="font-size:64px">${q.s}/${q.l.length}</div><p>${q.s==q.l.length?'全對！可以前進到下一組了。':'再多聽幾次，會越來越穩。'}</p></div><button class="btn wide" onclick="startQ()">再測一次</button><button class="btn wide ghost" onclick="go('abc')">回到字母卡</button>`;
 const c=q.l[q.i];
 return `<h1>聽音測驗</h1><p class="mu">第 ${q.i+1} / ${q.l.length} 題　${G[gi].n}</p><p>聽發音，選出對應的字母：</p>
 <button class="btn wide" onclick="say('${c[3]}')">🔊 再聽一次</button>
 <div class="opts">${q.o.map((o,k)=>`<button class="opt ${q.a===null?'':(o[0]==c[0]?'ok':(k==q.a?'no':''))}" onclick="ans(${k})">${o[0]}</button>`).join('')}</div>`}
function voc0(){return `<h1>常用單字</h1><p class="mu">點一下聽發音。想自我測驗就先把中文藏起來。</p>
 <div class="row"><button class="btn ghost" onclick="hide=!hide;render()">${hide?'顯示中文':'隱藏中文'}</button></div>
 ${V.map(w=>`<button class="w" onclick="say('${w[0]}')"><span><b>${w[0]}</b><br><span class="mu">${w[2]}</span></span><span>${hide?'？':w[1]} 🔊</span></button>`).join('')}`}
function gra(){return `<h1>文法</h1><p class="mu">點開每一項，再點例句聽發音。</p>${GR.map(g=>`<details><summary>${g[0]}</summary><p>${g[1]}</p>${g[2].map(e=>`<button class="ex" onclick="say('${e[0].split('→').pop().trim()}')"><b>${e[0]}</b>　<span class="mu">${e[1]}</span> 🔊</button>`).join('')}</details>`).join('')}`}
function err(){return `<h1>常見錯誤</h1>${ER.map(e=>`<details><summary>${e[0]}</summary><p class="good">✓ ${e[1]}</p><p class="bad">✗ ${e[2]}</p><p>${e[3]}</p></details>`).join('')}`}
function startP(){pl={i:0,s:0,a:null};cur='plc';render()}
function pans(k){if(pl.a!==null)return;pl.a=k;if(k==PQ[pl.i][2])pl.s++;render();setTimeout(()=>{pl.i++;pl.a=null;render()},700)}
function plc(){
 if(pl.i>=PQ.length){const r=[['abc','從 40 音開始','先把字母和發音打穩。'],['voc','從單字開始','字母已經有基礎，可以累積單字。'],['gra','從文法開始','先補上助詞與敬語現在式。'],['err','從常見錯誤開始','基礎不錯，來修正容易犯的錯。'],['err','從常見錯誤開始','基礎不錯，來修正容易犯的錯。']][pl.s];
  return `<h1>建議起點</h1><div class="card"><p style="font-size:20px"><b>${r[1]}</b></p><p>${r[2]}（答對 ${pl.s}/4）</p></div><button class="btn wide" onclick="go('${r[0]}')">開始學習</button><button class="btn wide ghost" onclick="go('home')">回首頁</button>`}
 const x=PQ[pl.i];
 return `<h1>小測驗</h1><p class="mu">第 ${pl.i+1} / ${PQ.length} 題</p><p><b>${x[0]}</b></p><div class="opts">${x[1].map((o,k)=>`<button class="opt ${pl.a===null?'':(k==x[2]?'ok':(k==pl.a?'no':''))}" style="font-size:18px" onclick="pans(${k})">${o}</button>`).join('')}</div>`}
function render(){
 const v={home,abc:()=>q?quiz():abc(),voc,gra,err,plc}[cur]();$('app').innerHTML=v;
 const t=[['home','🏠','首頁'],['abc','ㄱ','40音'],['voc','📖','單字'],['gra','✏️','文法'],['err','⚠️','易錯']];
 $('nav').innerHTML=t.map(x=>`<button class="${x[0]==cur?'on':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}
render();
</script></body></html>
