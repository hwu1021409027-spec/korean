const NTX=`팔다=팔다→팔아요；ㄹ收尾遇到 ㅂ니다 會脫落：팝니다

닫다=닫다→닫아요；和 열다 是一組反義詞，可以一起背

받다=받다→받아요；常搭配 선물／사인／전화（收到、接到）
자다=자다→자요；敬語是 주무시다
일어나다=일어나다→일어나요；也可以指「站起來」
작다=작다→작아요；크다 變「커요」（ㅡ脫落），兩個變化不同
적다=적다→적어요；數量少用「적다」，大小小用「작다」
나쁘다=ㅡ脫落：나쁘다→나빠요；기분이 나빠요＝心情不好
싸다=싸다→싸요；也有「包起來」的意思，看語境
빠르다=르不規則：빠르다→빨라요（ㄹ 多一個）
느리다=느리다→느려요（ㅣ+어→여）
멀다=멀다→멀어요；ㄹ收尾，格式體是 몉니다
가깝다=ㅂ不規則：가깝다→가까워요
쉽다=ㅂ不規則：쉽다→쉬워요
어렵다=ㅂ不規則：어렵다→어려워요
날씨=날씨가 좋다／나쁘다／덥다／춥다，主語用 이/가
비=비가 오다（下雨）、눈이 오다（下雪），要記得搭配「오다」
눈=눈 有兩個意思：雪、眼睛，看語境
머리=머리가 아파요＝我頭痛；「…이/가 아파요」可套用在任何身體部位
아프다=ㅡ脫落：아프다→아파요；「…이/가 아파요」說明哪裡痛
감기=감기에 걸리다（感冒），걸렸어요＝걸리다 的過去式
따뜻하다=하다 類形容詞：따뜻해요；따뜻한 차＝熱茶
시원하다=시원해요；可形容涼爽，也可形容喝湯的「好舒服」
목=목 是喉嚨也是脖子；목이 아파요＝喉嚨痛
다리=다리 是腿，也有「橋」的意思；다리가 아파요＝腿痛
짜다=짜다→짜요；너무 짜요＝太鹹了
달다=ㄹ脫落：달다→달아요；달콤하다 也是甜
시다=시다→시어요（口語常說 셔요）
차갑다=ㅂ不規則：차갑다→차가워요

맛있다=發音 [마시써요]；反義詞 맛없다（不好吃）
쓰다=ㅡ脫落：쓰다→써요；「쓰다」也有寫、戴、使用的意思
느끼하다=느끼해요；形容油膩、膩口
고소하다=고소해요；形容芝麻、花生那種香`;

const GR=[

['-고 싶어요　想要','詞幹加「고 싶어요」，表示「我想做…」。',[['한국에 가고 싶어요.','我想去韓國。'],['커피를 마시고 싶어요.','我想喝咖啡。']]],
['에 / 에서　地點助詞','「에」表示去的地方或存在的地點；「에서」表示動作發生的地點。',[['학교에 가요.','去學校。'],['집에서 밥을 먹어요.','在家吃飯。']]],
['안　否定','動詞前加「안」，表示「不做…」。',[['안 먹어요.','我不吃。'],['안 가요.','我不去。']]],
['-(으)세요　請…（敬語）','動詞詞幹加「세요」，有收尾音加「으세요」。可以表示請求，也可以對長輩說話用。',[['여기 앉으세요.','請坐這裡。'],['어서 오세요.','歡迎光臨。'],['많이 드세요.','請多吃一點。']]],
['-(으)ㄹ 거예요　未來／打算','詞幹沒有收尾音加「ㄹ 거예요」，有收尾音加「을 거예요」。',[['내일 친구를 만날 거예요.','我明天要見朋友。'],['주말에 집에서 쉴 거예요.','週末我要在家休息。']]],
['-(으)ㄹ까요?　要不要…？','用來提議或詢問對方意見，常搭配「같이（一起）」。',[['같이 영화를 볼까요?','一起看電影好嗎？'],['뭐 먹을까요?','要吃什麼呢？']]],
['-아/어서　因為…所以','表示原因，接在詞幹後面。注意：後面不能接「-세요」或「-ㅂ시다」。',[['비가 와서 집에 있어요.','因為下雨，所以在家。'],['배가 아파서 병원에 갔어요.','因為肚子痛，所以去了醫院。']]],
['-아/어야 해요　必須','表示「一定要…」，規則同 -아/어요 的接法。',[['내일 시험이 있어서 공부해야 해요.','明天有考試，所以必須讀書。'],['일찍 자야 해요.','必須早點睡。']]],
['-고 있어요　正在…','表示動作正在進行。',[['지금 밥을 먹고 있어요.','我現在正在吃飯。'],['친구를 기다리고 있어요.','我正在等朋友。']]],
['-(으)면　如果…','表示假設，有收尾音加「으면」。',[['시간이 있으면 같이 가요.','有時間的話一起去吧。'],['비가 오면 안 가요.','如果下雨我就不去。']]],
['에게 / 한테　對…、給…','用在人身上，「한테」比較口語。物品或地點用「에」。',[['친구에게 선물을 줬어요.','我送了朋友禮物。'],['엄마한테 전화했어요.','我打了電話給媽媽。']]],
['하고 / (이)랑　和…','連接名詞，「하고」和「랑」都很常用，口語中「랑」更親切。',[['친구하고 같이 가요.','和朋友一起去。'],['빵이랑 우유를 샀어요.','我買了麵包和牛奶。']]],
['부터 / 까지　從…到…','「부터」表示起點，「까지」表示終點，可用於時間和地點。',[['아홉 시부터 여섯 시까지 일해요.','從九點工作到六點。'],['집에서 학교까지 십 분 걸려요.','從家到學校要十分鐘。']]],
['도　也','加在名詞後面，取代 은/는、이/가、을/를。',[['저도 학생이에요.','我也是學生。'],['커피도 마셔요.','我也喝咖啡。']]],

['-(으)니까　因為（可接請求）','有收尾音加「으니까」。語氣比 -아/어서 更強調理由，後面可以接「-세요」「-ㅂ시다」「-ㄹ까요?」。',[['피곤하니까 일찍 쉬세요.','你累了，所以請早點休息。'],['비가 오니까 우산을 가져가세요.','因為下雨，請帶傘。']]]];

 const n=G.slice(0,5).reduce((s,g,i)=>s+g.d.filter((_,j)=>P['l'+i+'_'+j]).length,0);
 return `<h1>韓文學習 🇰🇷</h1><p class="mu">從完全不會，到 TOPIK 2 級前。選一個適合你的起點就能開始。</p>
 <h2>你想從哪裡開始？</h2>

 <button class="start" onclick="go('voc')"><span class="i">🔤</span><div><b>認得字母，想學單字</b><span class="mu">日常常用單字，邊聽邊記</span></div></button>
 <button class="start" onclick="go('gra')"><span class="i">💬</span><div><b>會簡單單字，想學文法</b><span class="mu">助詞、過去式與常用句型</span></div></button>
 <button class="start" onclick="go('err')"><span class="i">🎯</span><div><b>學過一陣子，想修正錯誤</b><span class="mu">初學者最常犯的錯</span></div></button>

 <button class="start" onclick="startP()"><span class="i">🧭</span><div><b>不確定？做 4 題小測驗</b><span class="mu">幫你推薦起點</span></div></button>

 if(ci>=0){const c=g.d[ci];h+=`<div class="card"><div class="big">${c[0]}</div><div class="rom">${show?c[1]+'　'+c[2]:'先想想怎麼唸，再看答案'}</div>
