 <button class="start" onclick="go('gra')"><span class="i">💬</span><div><b>會簡單單字，想學文法</b><span class="mu">助詞、過去式與常用句型</span></div></button>
 <button class="start" onclick="go('err')"><span class="i">🎯</span><div><b>學過一陣子，想修正錯誤</b><span class="mu">初學者最常犯的錯</span></div></button>
 <button class="start" onclick="go('trv')"><span class="i">✈️</span><div><b>要去韓國旅遊</b><span class="mu">機場、交通、住宿、餐廳、購物、緊急</span></div></button>
 <button class="start" onclick="go('tp')"><span class="i">📝</span><div><b>想直接練 TOPIK 題型</b><span class="mu">仿 TOPIK I 的原創模擬題</span></div></button>
 <button class="start" onclick="startP()"><span class="i">🧭</span><div><b>不確定？做 4 題小測驗</b><span class="mu">幫你推薦起點</span></div></button>
 <h2>更多工具</h2><div class="row"><button class="btn ghost" onclick="go('num')">🔢 數字・時間・日期</button><button class="btn ghost" onclick="go('wb')">📒 錯題本${(P.wq||[]).length+(P.wv||[]).length?'（'+((P.wq||[]).length+(P.wv||[]).length)+'）':''}</button></div><div class="row"><button class="btn ghost" onclick="go('fan')">🎤 追星用語（綜藝・歌曲・戲劇）</button></div><h2>40 音進度</h2><div class="bar"><i style="width:${n/40*100}%"></i></div><p class="mu">已看過 ${n} / 40 個字母${P.best?'　最佳測驗：'+P.best+' 分':''}</p>`}
function abc(){
 const g=G[gi];
 let h=`<h1>40 音</h1><div class="chips">${G.map((x,i)=>`<button class="chip ${i==gi?'on':''}" onclick="gi=${i};ci=-1;show=false;render()">${x.n}</button>`).join('')}</div><div class="note">${g.tip}</div>
 <div class="grid">${g.d.map((c,i)=>`<button class="tile ${P['l'+gi+'_'+i]?'done':''} ${i==ci?'sel':''}" onclick="pick(${i})">${c[0]}</button>`).join('')}</div>`;
 if(ci>=0){const c=g.d[ci];h+=`<div class="card"><div class="big">${c[0]}</div><div class="rom">${show?c[1]+'　'+c[2]:'先想想怎麼唸，再看答案'}</div>
 <div class="row"><button class="btn" onclick="say('${c[3]}')">🔊 聽發音</button><button class="btn ghost" onclick="show=!show;render()">${show?'隱藏讀音':'顯示讀音'}</button></div>
 <div class="row"><button class="btn ghost" onclick="step(-1)">上一個</button><button class="btn ghost" onclick="step(1)">下一個</button></div></div>`}
 else h+=`<p class="mu" style="margin-top:12px">點任一個字母開始學習。</p>`;
 return h+`<button class="btn wide" onclick="startQ()">🎧 聽音測驗：${g.n}</button>`}
function pick(i){ci=i;show=false;P['l'+gi+'_'+i]=1;save();say(G[gi].d[i][3]);render()}
function step(d){const n=G[gi].d.length;pick((ci+d+n)%n)}
function startQ(){const g=G[gi];q={l:sh(g.d).slice(0,8),i:0,s:0,done:false};ask()}
function ask(){const g=G[gi],c=q.l[q.i];const pool=g.d.length>=4?g.d:G.flatMap(x=>x.d);
 q.o=sh([c,...sh(pool.filter(x=>x[0]!=c[0])).slice(0,3)]);q.a=null;setTimeout(()=>say(c[3]),200);render()}
function ans(k){if(q.a!==null)return;q.a=k;const c=q.l[q.i];if(q.o[k][0]==c[0])q.s++;render();
 setTimeout(()=>{q.i++;if(q.i>=q.l.length){q.done=true;P.best=Math.max(P.best||0,q.s);save();render()}else ask()},800)}
function quiz(){
 if(q.done)return `<h1>測驗完成</h1><div class="card"><div class="big" style="font-size:64px">${q.s}/${q.l.length}</div><p>${q.s==q.l.length?'全對！可以前進到下一組了。':'再多聽幾次，會越來越穩。'}</p></div><button class="btn wide" onclick="startQ()">再測一次</button><button class="btn wide ghost" onclick="go('abc')">回到字母卡</button>`;
 const c=q.l[q.i];
 return `<h1>聽音測驗</h1><p class="mu">第 ${q.i+1} / ${q.l.length} 題　${G[gi].n}</p><p>聽發音，選出對應的字母：</p>
 <button class="btn wide" onclick="say('${c[3]}')">🔊 再聽一次</button>
 <div class="opts">${q.o.map((o,k)=>`<button class="opt ${q.a===null?'':(o[0]==c[0]?'ok':(k==q.a?'no':''))}" onclick="ans(${k})">${o[0]}</button>`).join('')}</div>`}
function voc0(){return `<h1>常用單字</h1><p class="mu">點一下聽發音。想自我測驗就先把中文藏起來。</p>
 <div class="row"><button class="btn ghost" onclick="hide=!hide;render()">${hide?'顯示中文':'隱藏中文'}</button></div>
 ${V.map(w=>`<button class="w" onclick="say('${w[0]}')"><span><b>${w[0]}</b><br><span class="mu">${w[2]}</span></span><span>${hide?'？':w[1]} 🔊</span></button>`).join('')}`}
function gra0(){return `<h1>文法</h1><p class="mu">點開每一項，再點例句聽發音。</p>${GR.map(g=>`<details><summary>${g[0]}</summary><p>${g[1]}</p>${g[2].map(e=>`<button class="ex" onclick="say('${e[0].split('→').pop().trim()}')"><b>${e[0]}</b>　<span class="mu">${e[1]}</span> 🔊</button>`).join('')}</details>`).join('')}`}
function err(){return `<h1>常見錯誤</h1>${ER.map(e=>`<details><summary>${e[0]}</summary><p class="good">✓ ${e[1]}</p><p class="bad">✗ ${e[2]}</p><p>${e[3]}</p></details>`).join('')}`}
function startP(){pl={i:0,s:0,a:null};cur='plc';render()}
function pans(k){if(pl.a!==null)return;pl.a=k;if(k==PQ[pl.i][2])pl.s++;render();setTimeout(()=>{pl.i++;pl.a=null;render()},700)}
function plc(){
 if(pl.i>=PQ.length){const r=[['abc','從 40 音開始','先把字母和發音打穩。'],['voc','從單字開始','字母已經有基礎，可以累積單字。'],['gra','從文法開始','先補上助詞與敬語現在式。'],['err','從常見錯誤開始','基礎不錯，來修正容易犯的錯。'],['err','從常見錯誤開始','基礎不錯，來修正容易犯的錯。']][pl.s];
  return `<h1>建議起點</h1><div class="card"><p style="font-size:20px"><b>${r[1]}</b></p><p>${r[2]}（答對 ${pl.s}/4）</p></div><button class="btn wide" onclick="go('${r[0]}')">開始學習</button><button class="btn wide ghost" onclick="go('home')">回首頁</button>`}
 const x=PQ[pl.i];
 return `<h1>小測驗</h1><p class="mu">第 ${pl.i+1} / ${PQ.length} 題</p><p><b>${x[0]}</b></p><div class="opts">${x[1].map((o,k)=>`<button class="opt ${pl.a===null?'':(k==x[2]?'ok':(k==pl.a?'no':''))}" style="font-size:18px" onclick="pans(${k})">${o}</button>`).join('')}</div>`}
function render(){
 const v={home,abc:()=>q?quiz():abc(),voc,gra,err,plc,tp,trv,wb,num,fan}[cur]();$('app').innerHTML=v;
 const t=[['home','🏠','首頁'],['abc','ㄱ','40音'],['voc','📖','單字'],['gra','✏️','文法'],['err','⚠️','易錯'],['tp','📝','TOPIK'],['trv','✈️','旅遊']];
 $('nav').innerHTML=t.map(x=>`<button class="${x[0]==cur?'on':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}
render();
</script></body></html>
